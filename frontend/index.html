<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Tickelot — boletería, cupos por promotor y control de aforo en puerta con escaneo QR anti-reuso." />
    <!-- Preconnect a Google Fonts: la fuente empieza a bajar antes de que el
         CSS la descubra → ahorra ~1 RTT en el first paint con Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tickelot" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a2f8f'/%3E%3Crect x='6' y='11' width='20' height='10' rx='2.5' fill='%23f0a832'/%3E%3Ccircle cx='18.5' cy='11' r='1.6' fill='%232a2f8f'/%3E%3Ccircle cx='18.5' cy='21' r='1.6' fill='%232a2f8f'/%3E%3Cline x1='18.5' y1='13.4' x2='18.5' y2='18.6' stroke='%23ffffff' stroke-width='.8' stroke-dasharray='.5 2' stroke-linecap='round'/%3E%3Crect x='20.2' y='13.5' width='4' height='4' rx='.8' fill='%232a2f8f'/%3E%3Cpath d='m9.4 13.2.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9.9-2.4Z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Tickelot — Boletería y Aforo</title>
    <script>
      // Tema antes del primer paint: lee la preferencia y aplica
      // data-theme="light" si corresponde — cero flash blanco al cargar.
      // El default (sin atributo) es dark, como siempre.
      // Dentro del <head>: un segundo <head> en el body era HTML invalido y
      // retrasaba el anti-flash (el bloque quedaba despues del div#root).
      try {
        var t = localStorage.getItem("tf_theme");
        if (
          t === "light" ||
          (t !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f4f4f5");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA: el service worker solo en producción (https) o localhost para QA.
      if (
        "serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
