    <script>
      // Tema antes del primer paint: lee la preferencia y aplica
      // data-theme="light" si corresponde — cero flash blanco al cargar.
      // El default (sin atributo) es dark, como siempre.
      // Dentro del <head>: un segundo <head> en el body era HTML invalido y
      // retrasaba el anti-flash (el bloque quedaba despues del div#root).
      try {
        var t = localStorage.getItem("tf_theme");
        if (
          t === "light" ||
          (t !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f4f4f5");
        }
      } catch (e) {}
      // Movimiento reducido antes del primer paint: si la persona lo pidió en
      // la app, la primera animación ya no corre (evita el parpadeo de que
      // todo se mueva una vez y luego se apague). El SO se respeta aparte,
      // vía @media en el CSS.
      try {
        if (localStorage.getItem("tf_motion") === "reduce") {
          document.documentElement.dataset.motion = "reduce";
        }
      } catch (e) {}
    </script>

      // PWA: el service worker solo en producción (https) o localhost para QA.
      if (
        "serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
