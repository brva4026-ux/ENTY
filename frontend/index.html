<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="TicketFlow — boletería, cupos por promotor y control de aforo en puerta con escaneo QR anti-reuso." />
    <!-- Preconnect a Google Fonts: la fuente empieza a bajar antes de que el
         CSS la descubra → ahorra ~1 RTT en el first paint con Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TicketFlow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 10a1.5 1.5 0 0 1 1.5-1.5h11A1.5 1.5 0 0 1 23 10v3a2.5 2.5 0 0 0 0 6v3a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 9 22v-3a2.5 2.5 0 0 0 0-6v-3z' fill='%23ffffff'/%3E%3Cpath d='M15.25 8.5h1.5v15h-1.5z' fill='%237c3aed'/%3E%3C/svg%3E" />
    <title>TicketFlow — Boletería y Aforo</title>
    <script>
      // Tema antes del primer paint: lee la preferencia y aplica
      // data-theme="light" si corresponde — cero flash blanco al cargar.
      // El default (sin atributo) es dark, como siempre.
      // Dentro del <head>: un segundo <head> en el body era HTML invalido y
      // retrasaba el anti-flash (el bloque quedaba despues del div#root).
      try {
        var t = localStorage.getItem("tf_theme");
        if (
          t === "light" ||
          (t !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f4f4f5");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA: el service worker solo en producción (https) o localhost para QA.
      if (
        "serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
