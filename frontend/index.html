    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "V-Pass",
        "url": "https://ticketflow-git-master-brva4026-uxs-projects.vercel.app/",
        "logo": "https://ticketflow-git-master-brva4026-uxs-projects.vercel.app/icons/icon-512.png",

      }
    </script>
    <script>
      // Tema antes del primer paint: lee la preferencia y aplica
      // data-theme="light" si corresponde — cero flash blanco al cargar.
      // El default (sin atributo) es dark, como siempre.
      // Dentro del <head>: un segundo <head> en el body era HTML invalido y
      // retrasaba el anti-flash (el bloque quedaba despues del div#root).
      try {
        var t = localStorage.getItem("tf_theme");
        // Rutas de superficie SIEMPRE oscura (vitrina, detalle, boleta,
        // escaner). En ellas no se aplica el tema claro: su candado oscuro
        // (forceDarkOnce) corre en React, DESPUES del primer paint, y hasta
        // entonces la pagina se pintaba clara y saltaba a negra (FOLT). Al
        // no marcar claro aqui, el primer paint ya sale oscuro. Mantener en
        // sincronia con las paginas que llaman forceDarkOnce.
        var p = location.pathname;
        var dark =
          p === "/inicio" ||
          p === "/boletas" ||
          p === "/t" ||
          p === "/bouncer" ||
          p.indexOf("/evento/") === 0;
        if (
          !dark &&
          (t === "light" ||
            (t !== "dark" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches))
        ) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f4f4f5");
        }
      } catch (e) {}
      // Movimiento reducido antes del primer paint: si la persona lo pidió en
      // la app, la primera animación ya no corre (evita el parpadeo de que
      // todo se mueva una vez y luego se apague). El SO se respeta aparte,
      // vía @media en el CSS.
      try {
        if (localStorage.getItem("tf_motion") === "reduce") {
          document.documentElement.dataset.motion = "reduce";
        }
      } catch (e) {}
    </script>

      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
