<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-*) resuelve a 0 en
         iOS y todo el codigo que ya reserva el notch / home indicator
         (Layout.jsx, BouncerScanner, AdminDashboard) queda inerte. -->

    <meta name="theme-color" content="#0c0a09" />
    <meta name="description" content="Enty — boletería, cupos por promotor y control de aforo en puerta con escaneo QR anti-reuso." />
    <!-- Fuente self-hosted (Sora variable, public/fonts): preload para que el
         primer paint use la voz de marca; sin terceros, sin FOUT de red. -->

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Enty" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Enty — Boletería y Aforo</title>
    <script>
      // Tema antes del primer paint: lee la preferencia y aplica
      // data-theme="light" si corresponde — cero flash blanco al cargar.
      // El default (sin atributo) es dark, como siempre.
      // Dentro del <head>: un segundo <head> en el body era HTML invalido y
      // retrasaba el anti-flash (el bloque quedaba despues del div#root).
      try {
        var t = localStorage.getItem("tf_theme");
        if (
          t === "light" ||
          (t !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f2f1f0");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA: el service worker solo en contexto seguro. isSecureContext cubre
      // https, localhost Y 127.0.0.1 (los tres son contextos seguros por spec);
      // el check anterior por hostname dejaba fuera 127.0.0.1, que es el host
      // que usa el E2E, asi que el SW nunca se registraba ahi y el modo
      // offline de la puerta quedaba sin cobertura.
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
