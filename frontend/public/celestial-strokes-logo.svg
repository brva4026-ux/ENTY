<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="V-PASS">
  <defs>
    <!-- Fondo parchment/off-white -->
    <linearGradient id="parchment" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#FAF9F6"/>
      <stop offset="1" stop-color="#E8E6DF"/>
    </linearGradient>
    <!-- Gradiente azul agua -->
    <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#2C5AA0"/>
    </linearGradient>
    <!-- Gradiente para paz/rays -->
    <linearGradient id "peace-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo parchment -->
  <rect width="512" height="512" fill="url(#parchment)" rx="8"/>
  
  <!-- Agua - ondas concéntricas -->
  <g fill="none" stroke="rgba(44, 90, 160, 0.3)" stroke-width="1">
    <circle cx="256" cy="380" r="80"/>
    <circle cx="256" cy="380" r="60"/>
    <circle cx="256" cy="380" r="40"/>
    <circle cx="256" cy="380" r="20"/>
  </g>
  
  <!-- Mano en estilo sketch/ink - path simplificado -->
  <g stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Pulso/base de la mano -->
    <path d="M256 360 Q256 340 256 320"/>
    <!-- Dedos - señal de paz (2 dedos arriba) -->
    <path d="M240 280 C230 260 220 250 210 260 Q200 270 195 285"/>
    <path d="M272 280 C282 260 292 250 302 260 Q312 270 317 285"/>
    <!-- Muñeca/antebrazal -->
    <path d="M256 320 Q256 300 260 280"/>
    <path d="M256 320 Q256 300 252 280"/>
    <!-- Patrón abstracto en la mano (soles, lunas, llamas) - representadas como pequeños shapes -->
    <circle cx="230" cy="260" r="3" fill="#FF6B6B"/>
    <circle cx="270" cy="260" r="3" fill="#FF6B6B"/>
    <path d="M210 250 Q200 240 195 230" stroke="#FFD700" stroke-width="1.5"/>
    <path d="M302 260 Q312 250 317 255" stroke="#FFD700" stroke-width="1.5"/>
  </g>
  
  <!-- Texto CELESTIAL STROKES -->
  <text x="256" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#1A1A1A">V-PASS</text>
  
  <!-- Subtítulo -->
  <text x="256" y="230" text-anchor="middle" font-family="Apple Garamond, Baskerville, serif" font-size="20" fill="#6B6B6B">La mano en señal de paz, con la llama que arde</text>
  
  <!-- Firma Ray en esquina inferior derecha -->
  <text x="460" y="490" text-anchor="end" font-family="Segoe Script, cursive" font-size="18" fill="#4A90E2">V-Pass.</text>
</svg>