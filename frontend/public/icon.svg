<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tickelot">
  <defs>
    <!-- userSpaceOnUse: el campo sirve para el fondo entero sin ambiguedad. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="470" y2="512">
      <stop offset="0" stop-color="#1b2a5c"/>
      <stop offset="0.55" stop-color="#0f1c46"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <!-- El troquel es un HUECO de verdad (alpha 0), no un disco del color del
         fondo: asi se ve igual sobre el degradado y sobre los rayos. -->
    <mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="112" cy="353" r="27" fill="#000"/>
      <circle cx="400" cy="353" r="27" fill="#000"/>
    </mask>
  </defs>

  <!-- CAMPO: el navy del logo. Un solo plano con caida de luz, sin brillos. -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- Rayos de cartel: textura de fondo, apenas perceptible. -->
  <g fill="#f5e6c8" opacity="0.05">
    <path d="M256 256 96 24h92zM256 256 268 0h64zM256 256 480 128v84zM256 256 416 488h-92zM256 256 44 384v-84z"/>
  </g>

  <!-- LA CRIATURA: la llama. Es el elemento vivo de la marca. -->
  <path fill="url(#flame)" d="M256 40c40 64 88 108 88 168a88 88 0 0 1-176 0c0-36 18-58 42-70-4 30 5 46 23 53-14-49-9-95 23-151Z"/>
  <!-- El ojo que te mira, en tinta. -->
  <path fill="#0b1638" d="M212 206c19-29 69-29 88 0-19 29-69 29-88 0Z"/>
  <circle cx="256" cy="206" r="15" fill="#f5e6c8"/>
  <circle cx="262" cy="199" r="5" fill="#0b1638"/>

  <!-- LA BOLETA: el troquel lateral es la firma; la perforacion parte el
       talon, que es donde el bouncer escanea. -->
  <g mask="url(#perf)">
    <rect x="112" y="292" width="288" height="132" rx="20" fill="#f5e6c8"/>
    <path d="M338 312v92" stroke="#0f1c46" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 17"/>
    <g fill="#0f1c46">
      <rect x="360" y="316" width="24" height="84" rx="4"/>
      <rect x="360" y="316" width="7" height="84" fill="#f5e6c8"/>
      <rect x="376" y="316" width="8" height="84" rx="4"/>
    </g>
  </g>
</svg>
