<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Enty">
  <defs>
    <!-- Fondo negro mate con una caida de luz sutil desde arriba. -->
    <linearGradient id="field" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="256" y2="512">
      <stop offset="0" stop-color="#17151f"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </linearGradient>
    <!-- Filo violeta brillante (neon sutil), no plano. -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D29BF9"/>
      <stop offset="0.55" stop-color="#BB5CF6"/>
      <stop offset="1" stop-color="#8B2FE0"/>
    </linearGradient>
  </defs>

  <!-- CAMPO: icono cuadrado de esquinas muy redondeadas. -->
  <rect width="512" height="512" rx="118" fill="url(#field)"/>
  <!-- FILO violeta brillante. -->
  <rect x="9" y="9" width="494" height="494" rx="112" fill="none" stroke="url(#edge)" stroke-width="16" stroke-opacity="0.9"/>

  <!-- LA "E": asta y tres brazos, trazo redondeado (la voz de la marca). -->
  <g stroke="#FFFFFF" stroke-width="60" stroke-linecap="round" fill="none">
    <path d="M186 156 H318"/>
    <path d="M186 256 H292"/>
    <path d="M186 356 H318"/>
    <path d="M186 156 V356"/>
  </g>

  <!-- LA ESTRELLA de cuatro puntas, integrada al lateral derecho. -->
  <path fill="#BB5CF6" d="M356 196 l13 34 34 13 -34 13 -13 34 -13 -34 -34 -13 34 -13 z"/>
</svg>
