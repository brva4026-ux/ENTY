name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build frontend
        run: |
          cd frontend
          npm ci --no-fund --no-audit
          npm run build
      - name: Check dist output
        run: test -f frontend/dist/index.html

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ticketflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:devpassword@127.0.0.1:5432/ticketflow
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          cd backend
          pip install --no-cache-dir ".[dev]" || pip install --no-cache-dir -e "."
          pip install --no-cache-dir pytest
      - name: Run business-rule tests
        run: |
          cd backend
          python -m pytest tests/ -v --ignore=tests/test_race_redeem.py
