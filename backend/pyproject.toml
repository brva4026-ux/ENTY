[project]
name = "ticketflow-backend"
version = "0.1.0"
description = "Sistema de boleteria y control de aforo - backend FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "qrcode[pil]>=7.4",
    "Pillow>=10.3",
    "python-multipart>=0.0.9",
    # Zonas horarias para formatear el inicio del evento en la boleta-imagen
    # (ZoneInfo); 'UTC' fijo no basta para 'America/Bogota'.
    "tzdata>=2024.1",
    # Firma Web Push (VAPID ES256) y cifrado aes128gcm en app/core/pusher.py:
    # se importa directo, asi que se declara explicito (antes llegaba de rebote
    # como dependencia transitiva de python-jose[cryptography]).
    "cryptography>=42.0",
    # Cliente HTTP async para Web Push (envio a los endpoints de los browsers)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Alcance del gate: solo reglas que HOY pasan en limpio (ver CI, paso "Lint
# backend"). Es un gate que puede crecer, no uno que arranque en rojo: agregar
# un set nuevo (p.ej. "B" o "UP") obliga a limpiar todo el repo primero.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",  # importaciones (E401 multiples en una linea, E402 import fuera de arriba)
    "E7",  # sentencias (E711/E712/E713/E714/E721/E731/E741/E742)
    "E9",  # errores reales de runtime (E902 IOError, F821 undefined-name)
    "F",   # pyflakes: nombres sin usar, imports sin usar, f-strings rotos
    "I",   # orden de imports (isort)
]

[tool.ruff.lint.per-file-ignores]
# pytest inyecta `wompi_on` por nombre de parametro, asi que el import de la
# fixture se ve como "sin usar" (F401) y el parametro como "redefinicion"
# (F811). Ruff no modela fixtures: se silencia solo en este archivo.
"tests/test_checkout_reservations.py" = ["F401", "F811"]
